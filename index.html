<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electrochemical Plotter</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#172a36;font-family:Arial,sans-serif}main{max-width:1400px;margin:auto;padding:28px}header{border-bottom:1px solid #ccd5db;margin-bottom:24px}h1{font-size:28px;margin:0}h2{font-size:18px;margin-top:0}p{color:#566976;line-height:1.6}section{background:white;border:1px solid #dbe2e8;border-radius:12px;padding:24px;margin-bottom:18px}label{display:block;font-size:13px;margin-bottom:12px}input,select{display:block;width:100%;padding:9px;border:1px solid #c5d0d8;border-radius:6px;background:white;color:#172a36;margin-top:5px}input[type=checkbox]{display:inline;width:auto}input[type=color]{padding:2px;height:38px}button{background:#1e6479;color:white;border:0;border-radius:6px;padding:10px 15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#e8eff3;color:#204d60}.layout{display:grid;grid-template-columns:390px 1fr;gap:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}.series{border-bottom:1px solid #dde4e8;padding:10px 0;font-size:13px}.series button{padding:3px 8px;float:right}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.status{padding:12px;background:#eaf2f5;border-radius:8px;white-space:pre-wrap}.plot{width:100%;height:auto;background:white}details{margin:12px 0}summary{cursor:pointer}small{color:#566976}table{font-size:12px;width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}.scroll{overflow:auto}@media(max-width:900px){.layout{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><div id="root"></div><script src="./plot.js"></script></body></html>
